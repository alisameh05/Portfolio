name: PR validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Runtime, typecheck and context
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: |
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')"
          npm install --global "npm@$npm_version" --no-audit --no-fund
      - name: Install locked development dependencies
        run: npm run setup:validation
      - run: npm run test:setup
      - run: npm run typecheck
      - run: npm run phase4:focus:context
      - run: npm run test:arch
      - run: npm run contract:verify
