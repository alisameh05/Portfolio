name: PR validation

on:
  pull_request:
    # Stacked issue branches also need the source-bound Linux OS-signal gate.
    branches: ['**']
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase8-recovery:
    name: Phase 8 isolated recovery rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: npm install --global "npm@$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')" --no-audit --no-fund
      - run: npm run setup:validation
      - name: Pull isolated recovery services
        run: |
          docker pull postgres:17-alpine
          if ! docker pull public.ecr.aws/localstack/localstack:4.5.0; then
            # ECR Public can exhaust its anonymous data quota on hosted runners.
            # Use the same vendor/version from Docker Hub for the test image.
            docker pull localstack/localstack:4.5.0
            docker tag localstack/localstack:4.5.0 public.ecr.aws/localstack/localstack:4.5.0
          fi
      - name: Require isolated recovery and privacy reconciliation with zero skips
        run: npm run phase8:focus:recovery

  phase8-incidents:
    name: Phase 8 actionable incidents and optional outage readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: npm install --global "npm@$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')" --no-audit --no-fund
      - run: npm run setup:validation
      - run: node scripts/setup-ci-native-postgres.mjs
      - name: Require real PostgreSQL incidents and Scenario 15 with zero skips
        run: npm run phase8:focus:incidents
      - name: Publish sanitized incident acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-actionable-incidents-252
          path: evidence/phase8-actionable-incidents-252.json
          if-no-files-found: error
          retention-days: 14

  phase8-protected-trigger:
    name: Phase 8 protected due-work Linux PostgreSQL and OS SIGTERM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: |
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')"
          npm install --global "npm@$npm_version" --no-audit --no-fund
      - name: Install locked development dependencies
        run: npm run setup:validation
      - name: Select supported native PostgreSQL
        run: node scripts/setup-ci-native-postgres.mjs
      - name: Require real PostgreSQL protected-trigger and Linux OS-SIGTERM proof with zero skips
        run: npm run phase8:focus:protected-trigger
      - name: Publish sanitized Issue #249 protected-trigger evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-protected-trigger-249
          path: evidence/phase8-protected-trigger-249.json
          if-no-files-found: warn
          retention-days: 14

  validation:
    name: Runtime, typecheck and context
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: |
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')"
          npm install --global "npm@$npm_version" --no-audit --no-fund
      - name: Install locked development dependencies
        run: npm run setup:validation
      - name: Select supported native PostgreSQL
        run: node scripts/setup-ci-native-postgres.mjs
      - run: npm run test:setup
      - run: npm run typecheck
      - name: Require Phase 8 Owner exports, Issues #243/#244/#245/#247 acceptance with zero skips
        run: npm run phase8:focus:exports -- --with-storage
      - name: Require Issue #242 taxonomy PostgreSQL acceptance with zero skips
        id: taxonomy-acceptance
        run: npm run phase8:focus:taxonomy
      - name: Publish sanitized Phase 8 Owner export acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-owner-exports
          path: evidence/phase8-owner-exports-240.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized Issue #243 Media export acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-owner-export-media-243
          path: evidence/phase8-owner-export-media-243.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized Issue #244 CV export acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-owner-export-cv-244
          path: evidence/phase8-owner-export-cv-244.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized Issue #245 Moderation export acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-owner-export-moderation-245
          path: evidence/phase8-owner-export-moderation-245.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized Issue #247 expiry and reconciliation acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-owner-export-reconciliation-247
          path: evidence/phase8-owner-export-reconciliation-247.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized Issue #242 taxonomy acceptance evidence
        if: always() && steps.taxonomy-acceptance.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-owner-export-taxonomy-242
          path: evidence/phase8-owner-export-taxonomy-242.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run phase4:focus:context
      - run: npm run test:arch
      - run: npm run contract:verify
      - name: Require real PostgreSQL consent and crypto acceptance with zero skips
        run: npm run phase7:focus:consent
      - name: Require private Feedback PostgreSQL acceptance with zero skips
        run: npm run phase7:focus:feedback
      - name: Require Owner moderation PostgreSQL acceptance with zero skips
        run: npm run phase7:focus:moderation
      - name: Require Feedback suppression and public paging with zero skips
        run: npm run phase7:focus:suppression
      - name: Require lifecycle-safe interaction summaries with zero skips
        run: npm run phase7:focus:summaries
      - name: Publish sanitized summary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-summaries
          path: evidence/phase7-summaries-195.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish sanitized suppression evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-suppression
          path: evidence/phase7-suppression-194.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish sanitized moderation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-moderation
          path: evidence/phase7-moderation-193.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish sanitized Feedback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-feedback
          path: evidence/phase7-feedback-192.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish sanitized consent evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-consent
          path: evidence/phase7-consent-189.json
          if-no-files-found: error
          retention-days: 14

  local-auth:
    name: Local Auth real-token
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: |
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')"
          npm install --global "npm@$npm_version" --no-audit --no-fund
      - name: Install locked development dependencies
        run: npm run setup:validation
      - run: npm run test:local-auth-runner
      - name: Require actual local Auth token verification with zero skips
        run: npm run phase4:focus:local-auth

  portfolio-settings:
    name: Portfolio settings real-PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The Phase 3 predecessor assertions reject later domain activations.
      # Replay Phase 4 on its immutable release with that release's lockfile.
      # Current-source boundaries/contracts are checked by the validation job;
      # current media database acceptance uses the Phase 6 focused gates.
      - name: Check out the historical Phase 4 release (PR 105)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9806af81d4ce705c36d9b22089f77213d16887bc
          path: phase4-release
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: phase4-release/.nvmrc
          cache: npm
          cache-dependency-path: phase4-release/package-lock.json
      - name: Select pinned npm
        working-directory: phase4-release
        run: |
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')"
          npm install --global "npm@$npm_version" --no-audit --no-fund
      - name: Install locked development dependencies
        working-directory: phase4-release
        run: npm run setup:validation
      - name: Require historical Phase 4 real migration, restricted-role, and settings verification with zero skips
        working-directory: phase4-release
        run: npm run phase4:focus:settings
      - name: Publish sanitized Phase 4 database evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase4-database-integrity
          path: phase4-release/evidence/phase-4-database-integrity.json
          if-no-files-found: error
          retention-days: 14

  phase6-media-cv:
    name: Phase 6 Media and CV real-PostgreSQL-Storage
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The migration-access check resolves pinned predecessor merge commits
          # via `git ls-tree`, so the Phase 6 gate needs the full history.
          fetch-depth: 0
      - name: Remove stale Phase 6 evidence before setup
        run: >-
          node --input-type=module -e 'import { rmSync } from "node:fs";
          for (const path of ["evidence/phase-6-verification-setup.json", "evidence/phase6-upload-intent-148.json", "evidence/phase6-media-processing-149.json", "evidence/phase6-image-processing-150.json", "evidence/phase6-video-processing-151.json", "evidence/phase6-media-acceptance-152.json", "evidence/phase6-publication-media-153.json", "evidence/phase6-cv-portfolio-154.json", "evidence/phase6-cv-acceptance-155.json", "evidence/phase6-cv-activation-156.json", "evidence/phase6-media-rejection.json", "evidence/phase6-media-delivery-158.json", "evidence/phase6-cv-delivery-159.json", "evidence/phase6-public-capabilities-160.json", "evidence/phase6-owner-composition-161.json", "evidence/phase6-migration-access-162.json", "evidence/phase6-media-integration.json", "evidence/phase6-media-cv-integration-163.json", "evidence/phase6-gate-report.json"]) rmSync(path, { force: true });
          rmSync("evidence/phase6-gate-checks", { recursive: true, force: true });'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: |
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.npm')"
          npm install --global "npm@$npm_version" --no-audit --no-fund
      - name: Install locked development dependencies
        run: npm run setup:validation
      # Phase 6 verifies Phase 5 report/context hashes against this source tree.
      - name: Require fresh Phase 5 predecessor evidence for this source
        run: npm run phase5:gate
      - name: Build the portable Linux Docker validation runner
        run: docker compose -p portfolio-validation -f compose.validation.yaml build validation
      - name: Require the complete fail-closed Phase 6 gate
        env:
          MEDIA_TOOL_DIAGNOSTICS_FILE: evidence/phase6-gate-checks/media-tool-diagnostics.log
        run: npm run phase6:gate
      - name: Publish sanitized Phase 6 gate and component evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase6-gate
          path: |
            evidence/phase6-gate-report.json
            evidence/phase6-gate-checks/*.log
            evidence/phase-6-verification-setup.json
            evidence/phase6-upload-intent-148.json
            evidence/phase6-media-processing-149.json
            evidence/phase6-image-processing-150.json
            evidence/phase6-video-processing-151.json
            evidence/phase6-media-acceptance-152.json
            evidence/phase6-publication-media-153.json
            evidence/phase6-cv-portfolio-154.json
            evidence/phase6-cv-acceptance-155.json
            evidence/phase6-cv-activation-156.json
            evidence/phase6-media-rejection.json
            evidence/phase6-media-delivery-158.json
            evidence/phase6-cv-delivery-159.json
            evidence/phase6-public-capabilities-160.json
            evidence/phase6-owner-composition-161.json
            evidence/phase6-migration-access-162.json
            evidence/phase6-media-integration.json
            evidence/phase6-media-cv-integration-163.json
          if-no-files-found: warn
          retention-days: 14

  cloud-bootstrap:
    name: Cloud bootstrap from Node 20
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: node@sha256:a5fb035ac1dff34a4ecaea85f90f7321185695d3fd22c12ba12f4535a4647cc5 # 20.19.0-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare nvm without the repository runtime installed
        run: |
          test "$(node --version)" = v20.19.0
          test ! -d node_modules
          export NVM_DIR="$HOME/.nvm"
          git init -q "$NVM_DIR"
          git -C "$NVM_DIR" fetch --depth 1 https://github.com/nvm-sh/nvm.git 977563e97ddc66facf3a8e31c6cff01d236f09bd # v0.40.3
          git -C "$NVM_DIR" checkout --detach FETCH_HEAD
      - name: Verify cold setup and login activation
        run: bash scripts/codex-setup.sh
      - name: Verify cached maintenance repairs missing TypeScript
        run: |
          rm node_modules/typescript/package.json
          if bash -lc 'cd "$1"; npm run validation:ready' validation-test "$PWD"; then
            echo "Missing TypeScript was not rejected" >&2
            exit 1
          fi
          bash scripts/codex-setup.sh
      - name: Run the originally blocked checks in a new shell
        run: |
          bash -lc 'set -euo pipefail; cd "$1"; npm run typecheck; npm run phase4:focus:context' validation-test "$PWD"
