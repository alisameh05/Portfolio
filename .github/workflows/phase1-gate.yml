name: phase1-gate

on:
  push:
    branches: ["master", "phase1/**"]
  pull_request:
    branches: ["master"]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run phase1:gate
