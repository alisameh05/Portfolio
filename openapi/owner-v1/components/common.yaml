schemas:
  StableId:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    description: Immutable UUIDv7 identity, independent of routes, labels, and providers.
  Locale:
    type: string
    enum: [en, ar]
  FieldError:
    type: object
    additionalProperties: false
    required: [path, code, message]
    properties:
      path: { type: string, minLength: 1, maxLength: 256 }
      code: { type: string, pattern: '^[a-z0-9_]+$' }
      message: { type: string, minLength: 1, maxLength: 500 }
  Problem:
    type: object
    additionalProperties: false
    required: [type, title, status, detail, instance, code, traceId]
    properties:
      type:
        type: string
        format: uri
        pattern: '^urn:shipwithali:problem:[a-z0-9-]+$'
      title: { type: string, minLength: 1, maxLength: 120 }
      status: { type: integer, minimum: 400, maximum: 599 }
      detail: { type: string, minLength: 1, maxLength: 1000 }
      instance: { type: string, format: uri-reference }
      code:
        type: string
        enum:
          - validation
          - unauthenticated
          - forbidden
          - not_found
          - conflict
          - failed_precondition
          - unprocessable
          - rate_limited
          - temporarily_unavailable
          - internal_error
      traceId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
      fieldErrors:
        type: array
        maxItems: 50
        items: { $ref: '#/schemas/FieldError' }
  CommandReceipt:
    type: object
    additionalProperties: false
    required: [aggregateId, aggregateVersion, outcome]
    properties:
      aggregateId: { $ref: '#/schemas/StableId' }
      aggregateVersion: { type: integer, minimum: 1 }
      outcome:
        type: string
        enum:
          - configuration-updated
          - revision-saved
          - language-published
          - content-hidden
          - content-archived
          - content-restored
          - project-status-changed
          - project-featured-changed
          - public-slug-changed
          - project-related
          - taxonomy-value-created
          - taxonomy-value-renamed
          - taxonomy-value-retired
          - taxonomy-value-merged
          - taxonomy-value-assigned
          - media-processing-recorded
          - media-accepted
          - media-rejected
          - cv-version-accepted
          - current-cv-activated
          - feedback-approved
          - feedback-rejected
          - feedback-suppressed
          - analytics-goal-version-activated

parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    description: >-
      Visible-ASCII client value scoped by operation and Owner. Exact replay
      returns the original safe result; conflicting reuse returns 409.
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[\x21-\x7E]+$'
  IfMatch:
    name: If-Match
    in: header
    required: true
    description: Quoted expected aggregate version used for optimistic concurrency.
    schema:
      type: string
      pattern: '^"[1-9][0-9]*"$'
  ContentId:
    name: contentId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  ProjectId:
    name: projectId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  TaxonomyId:
    name: taxonomyId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  ValueId:
    name: valueId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  MediaId:
    name: mediaId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  VersionId:
    name: versionId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  FeedbackId:
    name: feedbackId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  GoalId:
    name: goalId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }
  ExportId:
    name: exportId
    in: path
    required: true
    schema: { $ref: '#/schemas/StableId' }

headers:
  RetryAfter:
    description: Whole seconds before another attempt.
    required: true
    schema: { type: integer, minimum: 1 }

responses:
  BadRequestProblem:
    description: The transport input is malformed or violates its declared shape.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  UnauthenticatedProblem:
    description: The Owner session is missing, invalid, or expired.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  ForbiddenProblem:
    description: The authenticated actor is not in the configured Owner allowlist.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  NotFoundProblem:
    description: The requested aggregate does not exist.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  ConflictProblem:
    description: The intent conflicts with identity, state, or idempotency history.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  FailedPreconditionProblem:
    description: If-Match does not match the current aggregate version.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  UnprocessableProblem:
    description: Valid transport input failed a publication, evidence, or domain rule.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  RateLimitedProblem:
    description: The Owner operation exceeded its rate limit.
    headers:
      Retry-After: { $ref: '#/headers/RetryAfter' }
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  TemporarilyUnavailableProblem:
    description: A required dependency is temporarily unavailable.
    headers:
      Retry-After: { $ref: '#/headers/RetryAfter' }
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  InternalProblem:
    description: An unexpected failure occurred without exposing internal detail.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
