schemas:
  OwnerExportScope:
    type: string
    enum:
      - portfolio-content
      - taxonomy
      - media-metadata
      - cv-metadata
      - moderation-history
      - analytics-reports
      - portfolio-configuration
  PublicEventDataCoverage:
    type: object
    description: Detailed Public event data is excluded; portable aggregate Analytics reports remain available.
    additionalProperties: false
    required: [mode]
    properties:
      mode: { type: string, const: excluded }
  RequestOwnerExportRequest:
    type: object
    additionalProperties: false
    required: [includedScopes]
    properties:
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
  RequestOwnerExportReceipt:
    type: object
    additionalProperties: false
    required: [exportId, outcome, state]
    properties:
      exportId: { $ref: ./common.yaml#/schemas/StableId }
      outcome: { type: string, const: owner-export-requested }
      state: { type: string, const: requested }
  PortableContentRevision:
    type: object
    additionalProperties: false
    required: [revisionId, locale, sequence, title, summary, body, reviewed, currentlyPublished]
    properties:
      revisionId: { $ref: ./common.yaml#/schemas/StableId }
      locale: { $ref: ./common.yaml#/schemas/Locale }
      sequence: { type: integer, minimum: 1 }
      title: { type: string, minLength: 1, maxLength: 160 }
      summary: { type: string, minLength: 1, maxLength: 500 }
      body: { type: string, minLength: 1, maxLength: 50000 }
      reviewed: { type: boolean }
      currentlyPublished: { type: boolean }
  PortfolioContentExportRecord:
    type: object
    additionalProperties: false
    required: [scope, value]
    properties:
      scope: { type: string, const: portfolio-content }
      value:
        type: object
        additionalProperties: false
        required: [contentId, contentType, lifecycle, revisions, publicRouteIdentity, routeHistory, relatedProjectIds, taxonomyValueIds, mediaAssetIds, evidenceItems]
        properties:
          contentId: { $ref: ./common.yaml#/schemas/StableId }
          contentType: { type: string, enum: [project, achievement, testimonial] }
          lifecycle: { type: string, enum: [draft, published, hidden, archived] }
          projectStatus:
            oneOf:
              - { type: string }
              - { type: 'null' }
          featured: { type: boolean }
          revisions:
            type: array
            minItems: 1
            items: { $ref: '#/schemas/PortableContentRevision' }
          publicRouteIdentity:
            oneOf:
              - { $ref: ./common.yaml#/schemas/StableId }
              - { type: 'null' }
          routeHistory:
            type: array
            items: { $ref: ./projects.yaml#/schemas/PublicRouteRedirectView }
          relatedProjectIds:
            type: array
            uniqueItems: true
            items: { $ref: ./common.yaml#/schemas/StableId }
          taxonomyValueIds:
            type: array
            uniqueItems: true
            items: { $ref: ./common.yaml#/schemas/StableId }
          mediaAssetIds:
            type: array
            uniqueItems: true
            items: { $ref: ./common.yaml#/schemas/StableId }
          evidenceItems:
            type: array
            items: { $ref: '#/schemas/PortableEvidenceItem' }
  PortableEvidenceItem:
    type: object
    additionalProperties: false
    required: [claim, state, supportingArtifactIds]
    properties:
      claim: { type: string, minLength: 1, maxLength: 1000 }
      state: { type: string, enum: [unreviewed, supported, unsupported] }
      supportingArtifactIds:
        type: array
        uniqueItems: true
        items: { $ref: ./common.yaml#/schemas/StableId }
      mediaAssetId: { $ref: ./common.yaml#/schemas/StableId }
  PortableTaxonomyRename:
    type: object
    additionalProperties: false
    required: [valueId, previousName, newName, renamedAt]
    properties:
      valueId: { $ref: ./common.yaml#/schemas/StableId }
      previousName: { type: string, minLength: 1, maxLength: 100 }
      newName: { type: string, minLength: 1, maxLength: 100 }
      renamedAt: { type: string, format: date-time }
  PortableTaxonomyAssignment:
    type: object
    additionalProperties: false
    required: [targetId, taxonomyValueId]
    properties:
      targetId: { $ref: ./common.yaml#/schemas/StableId }
      taxonomyValueId: { $ref: ./common.yaml#/schemas/StableId }
  PortableTaxonomyValue:
    oneOf:
      - { $ref: '#/schemas/PortableActiveTaxonomyValue' }
      - { $ref: '#/schemas/PortableRetiredTaxonomyValue' }
      - { $ref: '#/schemas/PortableMergedTaxonomyValue' }
    discriminator:
      propertyName: state
      mapping:
        active: '#/schemas/PortableActiveTaxonomyValue'
        retired: '#/schemas/PortableRetiredTaxonomyValue'
        merged: '#/schemas/PortableMergedTaxonomyValue'
  PortableActiveTaxonomyValue:
    type: object
    additionalProperties: false
    required: [valueId, name, state]
    properties:
      valueId: { $ref: ./common.yaml#/schemas/StableId }
      name: { type: string, minLength: 1, maxLength: 100 }
      state: { type: string, const: active }
  PortableRetiredTaxonomyValue:
    type: object
    additionalProperties: false
    required: [valueId, name, state]
    properties:
      valueId: { $ref: ./common.yaml#/schemas/StableId }
      name: { type: string, minLength: 1, maxLength: 100 }
      state: { type: string, const: retired }
  PortableMergedTaxonomyValue:
    type: object
    additionalProperties: false
    required: [valueId, name, state, mergedIntoId]
    properties:
      valueId: { $ref: ./common.yaml#/schemas/StableId }
      name: { type: string, minLength: 1, maxLength: 100 }
      state: { type: string, const: merged }
      mergedIntoId: { $ref: ./common.yaml#/schemas/StableId }
  TaxonomyExportRecord:
    type: object
    additionalProperties: false
    required: [scope, value]
    properties:
      scope: { type: string, const: taxonomy }
      value:
        type: object
        additionalProperties: false
        required: [taxonomyId, aggregateVersion, kind, values, renameHistory, assignments]
        properties:
          taxonomyId: { $ref: ./common.yaml#/schemas/StableId }
          aggregateVersion: { type: integer, minimum: 1 }
          kind: { type: string, enum: [category, ai-ml-domain, technology, project-type] }
          values:
            type: array
            items: { $ref: '#/schemas/PortableTaxonomyValue' }
          renameHistory:
            type: array
            items: { $ref: '#/schemas/PortableTaxonomyRename' }
          assignments:
            type: array
            items: { $ref: '#/schemas/PortableTaxonomyAssignment' }
  MediaMetadataExportRecord:
    type: object
    additionalProperties: false
    required: [scope, value]
    properties:
      scope: { type: string, const: media-metadata }
      value:
        type: object
        additionalProperties: false
        required: [mediaId, kind, state, accessibilityMetadata, processingHistory, decisionHistory, publicationState]
        properties:
          mediaId: { $ref: ./common.yaml#/schemas/StableId }
          kind: { $ref: ./media.yaml#/schemas/MediaKind }
          state: { type: string, enum: [upload-pending, processing, processed, accepted, rejected] }
          accessibilityMetadata:
            oneOf:
              - { $ref: ./media.yaml#/schemas/MediaAccessibilityMetadata }
              - { type: 'null' }
          processingHistory:
            type: array
            maxItems: 100
            items: { $ref: ./media.yaml#/schemas/MediaProcessingView }
          decisionHistory:
            type: array
            maxItems: 100
            items: { $ref: ./media.yaml#/schemas/MediaDecisionView }
          processingHistoryTruncated: { type: boolean, description: True when the 100-entry processing history is truncated. }
          decisionHistoryTruncated: { type: boolean, description: True when the 100-entry decision history is truncated. }
          publicationState: { type: string, enum: [private, accepted, published, withdrawn] }
          portableReference:
            type: string
            pattern: '^assets/media-metadata/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
            description: Package-relative path present only when accepted media bytes are included; omit for other states or when bytes are not packaged.
        allOf:
          - if:
              properties:
                portableReference: { type: string }
              required: [portableReference]
            then:
              properties:
                state: { type: string, const: accepted }
          - if:
              properties:
                processingHistoryTruncated: { const: true }
              required: [processingHistoryTruncated]
            then:
              properties:
                processingHistory: { type: array, minItems: 100 }
          - if:
              properties:
                decisionHistoryTruncated: { const: true }
              required: [decisionHistoryTruncated]
            then:
              properties:
                decisionHistory: { type: array, minItems: 100 }
  CvMetadataExportRecord:
    type: object
    additionalProperties: false
    required: [scope, value]
    properties:
      scope: { type: string, const: cv-metadata }
      value:
        type: object
        additionalProperties: false
        required: [aggregateVersion, currentVersionId, versions, activationHistory]
        properties:
          aggregateVersion: { type: integer, minimum: 1 }
          currentVersionId:
            oneOf:
              - { $ref: ./common.yaml#/schemas/StableId }
              - { type: 'null' }
          versionsTruncated: { type: boolean, description: True when older retained CV versions were omitted from this bounded view. }
          versions:
            type: array
            maxItems: 100
            items: { $ref: '#/schemas/PortableCvVersionExport' }
          activationHistory:
            type: array
            maxItems: 100
            items: { $ref: ./cv.yaml#/schemas/CvActivationView }
          activationHistoryTruncated: { type: boolean, description: True when older retained activations were omitted from this bounded view. }
        allOf:
          - if:
              properties:
                versionsTruncated: { const: true }
              required: [versionsTruncated]
            then:
              properties:
                versions: { type: array, minItems: 100 }
          - if:
              properties:
                activationHistoryTruncated: { const: true }
              required: [activationHistoryTruncated]
            then:
              properties:
                activationHistory: { type: array, minItems: 100 }
  PortableCvVersionExport:
    oneOf:
      - { $ref: '#/schemas/RegisteredPortableCvVersion' }
      - { $ref: '#/schemas/AcceptedPortableCvVersion' }
    discriminator:
      propertyName: state
      mapping:
        registered: '#/schemas/RegisteredPortableCvVersion'
        accepted: '#/schemas/AcceptedPortableCvVersion'
  RegisteredPortableCvVersion:
    type: object
    additionalProperties: false
    required: [versionId, mediaId, locale, label, state, isCurrent]
    properties:
      versionId: { $ref: ./common.yaml#/schemas/StableId }
      mediaId: { $ref: ./common.yaml#/schemas/StableId }
      locale: { type: string, const: en }
      label: { type: string, minLength: 1, maxLength: 120 }
      state: { type: string, const: registered }
      isCurrent: { type: boolean }
  AcceptedPortableCvVersion:
    type: object
    additionalProperties: false
    required: [versionId, mediaId, locale, label, state, isCurrent, portableReference]
    properties:
      versionId: { $ref: ./common.yaml#/schemas/StableId }
      mediaId: { $ref: ./common.yaml#/schemas/StableId }
      locale: { type: string, const: en }
      label: { type: string, minLength: 1, maxLength: 120 }
      state: { type: string, const: accepted }
      isCurrent: { type: boolean }
      portableReference:
        type: string
        pattern: '^assets/cv-metadata/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        description: Package-relative path for the accepted CV document included in the package.
  ModerationHistoryExportRecord:
    type: object
    additionalProperties: false
    required: [scope, value]
    properties:
      scope: { type: string, const: moderation-history }
      value:
        type: object
        additionalProperties: false
        required: [feedbackId, projectId, locale, aggregateVersion, state, authorName, paragraph, submittedAt, decisionHistory]
        properties:
          feedbackId: { $ref: ./common.yaml#/schemas/StableId }
          projectId: { $ref: ./common.yaml#/schemas/StableId }
          locale: { $ref: ./common.yaml#/schemas/Locale }
          aggregateVersion: { type: integer, minimum: 1 }
          state: { type: string, enum: [pending, approved, rejected, suppressed] }
          authorName: { type: string, minLength: 1, maxLength: 120 }
          paragraph: { type: string, minLength: 1, maxLength: 5000 }
          submittedAt: { type: string, format: date-time }
          decisionHistory:
            type: array
            items: { $ref: ./moderation.yaml#/schemas/ModerationDecisionView }
  PortableAnalyticsAggregate:
    type: object
    additionalProperties: false
    required: [goalVersionId, periodStart, periodEnd, sampleState, aggregateCount]
    properties:
      goalVersionId: { $ref: ./common.yaml#/schemas/StableId }
      periodStart: { type: string, format: date-time }
      periodEnd: { type: string, format: date-time }
      sampleState: { type: string, enum: [sufficient, low-sample, suppressed] }
      aggregateCount: { type: integer, minimum: 0 }
  AnalyticsReportExportRecord:
    type: object
    additionalProperties: false
    required: [scope, value]
    properties:
      scope: { type: string, const: analytics-reports }
      value:
        type: object
        additionalProperties: false
        required: [goal, reports]
        properties:
          goal: { $ref: ./measurement.yaml#/schemas/AnalyticsGoalAggregateView }
          reports:
            type: array
            items: { $ref: '#/schemas/PortableAnalyticsAggregate' }
  PortfolioConfigurationExportRecord:
    type: object
    additionalProperties: false
    required: [scope, value]
    properties:
      scope: { type: string, const: portfolio-configuration }
      value:
        type: object
        additionalProperties: false
        required: [profile, contactChannels, projectCta]
        properties:
          profile: { $ref: ./configuration.yaml#/schemas/ProfileUpdate }
          contactChannels: { $ref: ./configuration.yaml#/schemas/ContactChannelsUpdate }
          projectCta: { $ref: ./configuration.yaml#/schemas/ProjectCtaUpdate }
  OwnerExportRecord:
    oneOf:
      - { $ref: '#/schemas/PortfolioContentExportRecord' }
      - { $ref: '#/schemas/TaxonomyExportRecord' }
      - { $ref: '#/schemas/MediaMetadataExportRecord' }
      - { $ref: '#/schemas/CvMetadataExportRecord' }
      - { $ref: '#/schemas/ModerationHistoryExportRecord' }
      - { $ref: '#/schemas/AnalyticsReportExportRecord' }
      - { $ref: '#/schemas/PortfolioConfigurationExportRecord' }
    discriminator:
      propertyName: scope
      mapping:
        portfolio-content: '#/schemas/PortfolioContentExportRecord'
        taxonomy: '#/schemas/TaxonomyExportRecord'
        media-metadata: '#/schemas/MediaMetadataExportRecord'
        cv-metadata: '#/schemas/CvMetadataExportRecord'
        moderation-history: '#/schemas/ModerationHistoryExportRecord'
        analytics-reports: '#/schemas/AnalyticsReportExportRecord'
        portfolio-configuration: '#/schemas/PortfolioConfigurationExportRecord'
  OwnerExportEntryDescriptor:
    type: object
    description: Portable record-set entry identified independently of storage or database providers.
    additionalProperties: false
    required: [path, scope, mediaType, recordSchema, schemaPath, schemaVersion, digest, recordCount]
    properties:
      path:
        type: string
        pattern: '^[a-z0-9][a-z0-9._/-]*$'
        description: Relative path inside the export package.
      scope: { $ref: '#/schemas/OwnerExportScope' }
      mediaType:
        type: string
        enum: [application/x-ndjson, application/json]
      recordSchema:
        type: string
        format: uri
        enum:
          - urn:shipwithali:owner-export-schema:portfolio-content:1.0
          - urn:shipwithali:owner-export-schema:taxonomy:1.0
          - urn:shipwithali:owner-export-schema:media-metadata:1.0
          - urn:shipwithali:owner-export-schema:cv-metadata:1.0
          - urn:shipwithali:owner-export-schema:moderation-history:1.0
          - urn:shipwithali:owner-export-schema:analytics-reports:1.0
          - urn:shipwithali:owner-export-schema:portfolio-configuration:1.0
        description: Stable identifier for the corresponding OwnerExportRecord variant.
      schemaPath:
        type: string
        pattern: '^schemas/[a-z0-9-]+\.schema\.json$'
        description: Packaged JSON Schema file for offline compatible importers.
      schemaVersion: { type: string, pattern: '^[1-9][0-9]*\.[0-9]+$' }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      recordCount: { type: integer, minimum: 0 }
  OwnerExportManifestSchemaDescriptor:
    type: object
    additionalProperties: false
    required: [kind, path, schemaUri, schemaVersion, digest]
    properties:
      kind: { type: string, const: manifest }
      path: { type: string, const: schemas/manifest.schema.json }
      schemaUri: { type: string, const: 'urn:shipwithali:owner-export-schema:manifest:1.1' }
      schemaVersion: { type: string, const: '1.1' }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
  OwnerExportRecordSchemaDescriptor:
    type: object
    additionalProperties: false
    required: [kind, path, scope, schemaUri, schemaVersion, digest]
    properties:
      kind: { type: string, const: record }
      path:
        type: string
        pattern: '^schemas/[a-z0-9-]+\.schema\.json$'
      scope: { $ref: '#/schemas/OwnerExportScope' }
      schemaUri:
        type: string
        format: uri
        enum:
          - urn:shipwithali:owner-export-schema:portfolio-content:1.0
          - urn:shipwithali:owner-export-schema:taxonomy:1.0
          - urn:shipwithali:owner-export-schema:media-metadata:1.0
          - urn:shipwithali:owner-export-schema:cv-metadata:1.0
          - urn:shipwithali:owner-export-schema:moderation-history:1.0
          - urn:shipwithali:owner-export-schema:analytics-reports:1.0
          - urn:shipwithali:owner-export-schema:portfolio-configuration:1.0
      schemaVersion: { type: string, const: '1.0' }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
  OwnerExportSchemaDescriptor:
    oneOf:
      - { $ref: '#/schemas/OwnerExportManifestSchemaDescriptor' }
      - { $ref: '#/schemas/OwnerExportRecordSchemaDescriptor' }
  OwnerExportDependencyDescriptor:
    type: object
    additionalProperties: false
    required: [sourceScope, sourceId, targetScope, targetId, disposition]
    allOf:
      - if:
          properties:
            disposition: { const: omitted }
          required: [disposition]
        then:
          required: [reason]
        else:
          not: { required: [reason] }
    properties:
      sourceScope: { $ref: '#/schemas/OwnerExportScope' }
      sourceId: { $ref: ./common.yaml#/schemas/StableId }
      targetScope: { $ref: '#/schemas/OwnerExportScope' }
      targetId: { $ref: ./common.yaml#/schemas/StableId }
      disposition: { type: string, enum: [included, omitted] }
      reason: { type: string, enum: [scope-not-selected, not-retained, unsupported-variant, external-destination] }
  OwnerExportAssetDescriptor:
    type: object
    additionalProperties: false
    required: [path, scope, assetId, mediaType, byteLength, digest]
    properties:
      path: { type: string, pattern: '^assets/(?:media-metadata|cv-metadata)/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
      scope: { type: string, enum: [media-metadata, cv-metadata] }
      assetId: { $ref: ./common.yaml#/schemas/StableId }
      mediaType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp, video/mp4] }
      byteLength: { type: integer, minimum: 1, maximum: 9007199254740991 }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
  OwnerExportPackageManifestV1_0:
    type: object
    description: Legacy 1.0 manifest retained for read-only migration compatibility.
    additionalProperties: false
    required: [packageFormat, schemaVersion, createdAt, algorithm, digest, includedScopes, publicEventDataCoverage, entries]
    properties:
      packageFormat: { type: string, const: shipwithali-owner-export }
      schemaVersion: { type: string, const: '1.0' }
      createdAt: { type: string, format: date-time }
      algorithm: { type: string, const: sha-256 }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
      publicEventDataCoverage: { $ref: '#/schemas/PublicEventDataCoverage' }
      entries:
        type: array
        minItems: 1
        description: Data entries whose packaged schemaPath files define the versioned OwnerExportRecord shapes.
        items: { $ref: '#/schemas/OwnerExportEntryDescriptor' }
  OwnerExportPackageManifestV1_1:
    type: object
    description: Manifest 1.1 adds exact export and snapshot identity, dependency coverage, and integrity descriptors for records, schemas, and assets.
    additionalProperties: false
    required: [packageFormat, schemaVersion, exportId, snapshot, createdAt, algorithm, digest, requiredFeatures, includedScopes, publicEventDataCoverage, dependencies, exclusions, entries, schemas, assets]
    properties:
      packageFormat: { type: string, const: shipwithali-owner-export }
      schemaVersion: { type: string, pattern: '^1\.(?:[1-9][0-9]*)$' }
      exportId: { $ref: ./common.yaml#/schemas/StableId }
      snapshot:
        type: object
        additionalProperties: false
        required: [snapshotId, capturedAt, consistency]
        properties:
          snapshotId: { $ref: ./common.yaml#/schemas/StableId }
          capturedAt: { type: string, format: date-time }
          consistency: { type: string, const: transactional }
      createdAt: { type: string, format: date-time }
      algorithm: { type: string, const: sha-256 }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      requiredFeatures:
        type: array
        const: [asset-integrity-v1, dependency-coverage-v1, record-integrity-v1, schema-integrity-v1, snapshot-identity-v1]
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
      publicEventDataCoverage: { $ref: '#/schemas/PublicEventDataCoverage' }
      dependencies:
        type: array
        items: { $ref: '#/schemas/OwnerExportDependencyDescriptor' }
      exclusions:
        type: array
        const: [raw-public-event-data, functional-visitor-identities, measurement-visitor-identities, sessions, credentials, lab-entries]
      entries:
        type: array
        minItems: 1
        items: { $ref: '#/schemas/OwnerExportEntryDescriptor' }
      schemas:
        type: array
        minItems: 2
        items: { $ref: '#/schemas/OwnerExportSchemaDescriptor' }
      assets:
        type: array
        items: { $ref: '#/schemas/OwnerExportAssetDescriptor' }
      extensions:
        type: object
        additionalProperties: true
  OwnerExportPackageManifest:
    oneOf:
      - { $ref: '#/schemas/OwnerExportPackageManifestV1_0' }
      - { $ref: '#/schemas/OwnerExportPackageManifestV1_1' }
  RequestedOwnerExportView:
    type: object
    additionalProperties: false
    required: [exportId, state, schemaVersion, requestedAt, includedScopes, publicEventDataCoverage, downloadAvailable]
    properties:
      exportId: { $ref: ./common.yaml#/schemas/StableId }
      state: { type: string, const: requested }
      schemaVersion: { type: string, pattern: '^[1-9][0-9]*\.[0-9]+$' }
      requestedAt: { type: string, format: date-time }
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
      publicEventDataCoverage: { $ref: '#/schemas/PublicEventDataCoverage' }
      downloadAvailable: { type: boolean, const: false }
  BuildingOwnerExportView:
    type: object
    additionalProperties: false
    required: [exportId, state, schemaVersion, requestedAt, includedScopes, publicEventDataCoverage, downloadAvailable]
    properties:
      exportId: { $ref: ./common.yaml#/schemas/StableId }
      state: { type: string, const: building }
      schemaVersion: { type: string, pattern: '^[1-9][0-9]*\.[0-9]+$' }
      requestedAt: { type: string, format: date-time }
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
      publicEventDataCoverage: { $ref: '#/schemas/PublicEventDataCoverage' }
      downloadAvailable: { type: boolean, const: false }
  ReadyOwnerExportView:
    type: object
    description: A completed versioned domain artifact, never a database dump or provider backup.
    additionalProperties: false
    required: [exportId, state, schemaVersion, requestedAt, completedAt, includedScopes, publicEventDataCoverage, integrityManifest, downloadAvailable]
    properties:
      exportId: { $ref: ./common.yaml#/schemas/StableId }
      state: { type: string, const: ready }
      schemaVersion: { type: string, pattern: '^[1-9][0-9]*\.[0-9]+$' }
      requestedAt: { type: string, format: date-time }
      completedAt: { type: string, format: date-time }
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
      publicEventDataCoverage: { $ref: '#/schemas/PublicEventDataCoverage' }
      integrityManifest: { $ref: '#/schemas/OwnerExportPackageManifest' }
      downloadAvailable: { type: boolean, const: true }
  FailedOwnerExportView:
    type: object
    additionalProperties: false
    required: [exportId, state, schemaVersion, requestedAt, failedAt, failureCode, includedScopes, publicEventDataCoverage, downloadAvailable]
    properties:
      exportId: { $ref: ./common.yaml#/schemas/StableId }
      state: { type: string, const: failed }
      schemaVersion: { type: string, pattern: '^[1-9][0-9]*\.[0-9]+$' }
      requestedAt: { type: string, format: date-time }
      failedAt: { type: string, format: date-time }
      failureCode: { type: string, pattern: '^[a-z0-9_]+$' }
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
      publicEventDataCoverage: { $ref: '#/schemas/PublicEventDataCoverage' }
      downloadAvailable: { type: boolean, const: false }
  ExpiredOwnerExportView:
    type: object
    additionalProperties: false
    required: [exportId, state, schemaVersion, requestedAt, completedAt, expiredAt, includedScopes, publicEventDataCoverage, integrityManifest, downloadAvailable]
    properties:
      exportId: { $ref: ./common.yaml#/schemas/StableId }
      state: { type: string, const: expired }
      schemaVersion: { type: string, pattern: '^[1-9][0-9]*\.[0-9]+$' }
      requestedAt: { type: string, format: date-time }
      completedAt: { type: string, format: date-time }
      expiredAt: { type: string, format: date-time }
      includedScopes:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: '#/schemas/OwnerExportScope' }
      publicEventDataCoverage: { $ref: '#/schemas/PublicEventDataCoverage' }
      integrityManifest: { $ref: '#/schemas/OwnerExportPackageManifest' }
      downloadAvailable: { type: boolean, const: false }
  OwnerExportView:
    oneOf:
      - { $ref: '#/schemas/RequestedOwnerExportView' }
      - { $ref: '#/schemas/BuildingOwnerExportView' }
      - { $ref: '#/schemas/ReadyOwnerExportView' }
      - { $ref: '#/schemas/FailedOwnerExportView' }
      - { $ref: '#/schemas/ExpiredOwnerExportView' }
    discriminator:
      propertyName: state
      mapping:
        requested: '#/schemas/RequestedOwnerExportView'
        building: '#/schemas/BuildingOwnerExportView'
        ready: '#/schemas/ReadyOwnerExportView'
        failed: '#/schemas/FailedOwnerExportView'
        expired: '#/schemas/ExpiredOwnerExportView'
