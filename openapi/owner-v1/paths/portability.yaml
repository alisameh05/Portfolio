exports:
  post:
    operationId: requestOwnerExport
    summary: Request a versioned Owner export
    description: Requests a documented domain package subject to privacy and Retention policy rules.
    tags: [Portability]
    parameters:
      - { $ref: ../components/common.yaml#/parameters/IdempotencyKey }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/portability.yaml#/schemas/RequestOwnerExportRequest }
          examples:
            portablePortfolio:
              value:
                includedScopes:
                  - portfolio-content
                  - taxonomy
                  - media-metadata
                  - cv-metadata
                  - moderation-history
                  - analytics-reports
                  - portfolio-configuration
    responses:
      '202':
        description: Owner export request accepted for asynchronous preparation.
        content:
          application/json:
            schema: { $ref: ../components/portability.yaml#/schemas/RequestOwnerExportReceipt }
      '400': { $ref: ../components/common.yaml#/responses/BadRequestProblem }
      '401': { $ref: ../components/common.yaml#/responses/UnauthenticatedProblem }
      '403': { $ref: ../components/common.yaml#/responses/ForbiddenProblem }
      '409': { $ref: ../components/common.yaml#/responses/ConflictProblem }
      '422': { $ref: ../components/common.yaml#/responses/UnprocessableProblem }
      '429': { $ref: ../components/common.yaml#/responses/RateLimitedProblem }
      '500': { $ref: ../components/common.yaml#/responses/InternalProblem }
      '503': { $ref: ../components/common.yaml#/responses/TemporarilyUnavailableProblem }

export:
  parameters:
    - { $ref: ../components/common.yaml#/parameters/ExportId }
  get:
    operationId: getOwnerExport
    summary: Inspect an Owner export
    description: Returns version, scope, state, and integrity metadata without provider or database details.
