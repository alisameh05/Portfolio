    responses:
      '200':
        description: Owner export domain-artifact view.
        content:
          application/json:
            schema: { $ref: ../components/portability.yaml#/schemas/OwnerExportView }
            examples:
              readyWithOfflineIntegrityV1_1:
                summary: Ready export with an explicitly empty selected scope and packaged schema integrity
                value:
                  exportId: 01890f3e-7b2f-7cc0-98cf-5a2890378abc
                  state: ready
                  schemaVersion: '1.1'
                  requestedAt: '2026-10-23T10:00:00Z'
                  completedAt: '2026-10-23T10:01:00Z'
                  includedScopes: [analytics-reports]
                  publicEventDataCoverage: { mode: excluded }
                  integrityManifest:
                    packageFormat: shipwithali-owner-export
                    schemaVersion: '1.1'
                    exportId: 01890f3e-7b2f-7cc0-98cf-5a2890378abc
                    snapshot:
                      snapshotId: 01890f3e-7b2f-7cc0-98cf-5a2890378abd
                      capturedAt: '2026-10-23T09:59:59Z'
                      consistency: transactional
                    createdAt: '2026-10-23T10:01:00Z'
                    algorithm: sha-256
                    digest: ce6c1a31a5052e44b1f03a76a58dbb2670d4848a9e32497a849fc563d108efb1
                    requiredFeatures: [asset-integrity-v1, dependency-coverage-v1, record-integrity-v1, schema-integrity-v1, snapshot-identity-v1]
                    includedScopes: [analytics-reports]
