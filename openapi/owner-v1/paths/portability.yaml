                        schemaVersion: '1.0'
                        digest: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                        recordCount: 0
                    schemas:
                      - kind: manifest
                        path: schemas/manifest.schema.json
                        schemaUri: urn:shipwithali:owner-export-schema:manifest:1.1
                        schemaVersion: '1.1'
                        digest: cee62fcf794284c8c439a0b2d07e7103f63676f7accc16f2e76077180fe41c52
                      - kind: record
                        scope: analytics-reports
                        path: schemas/analytics-reports.schema.json
                        schemaUri: urn:shipwithali:owner-export-schema:analytics-reports:1.0
                        schemaVersion: '1.0'
                        digest: 7d0435d3e80081347534bce46c45365550a764a93ccbbf6b4997bbb6e8f836a3
