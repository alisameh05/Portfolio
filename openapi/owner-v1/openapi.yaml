components:
  schemas:
    OwnerExportRecord:
      $ref: ./components/portability.yaml#/schemas/OwnerExportRecord
    OwnerExportRecordV1_1:
      $ref: ./components/portability.yaml#/schemas/OwnerExportRecordV1_1
  securitySchemes:
    OwnerSession:
      type: apiKey
      in: cookie
      name: sw_owner_session
      description: >-
        A server-verified Supabase session originating from GitHub OAuth. The
        authenticated actor must also match the configured Owner allowlist;
        authentication alone never grants Owner authorization.
