openapi: 3.1.0
info:
  title: ShipWithAli Owner API
  version: 1.0.0
  license:
    name: All rights reserved
    identifier: LicenseRef-All-Rights-Reserved
  description: >-
    Authenticated, command-oriented Owner transport contract. The implemented
    slices cover Portfolio Configuration, content Publication, Project intent,
    controlled Taxonomy evolution, private Media acceptance, CV Portfolio
    history, Feedback Moderation, immutable Analytics goal versions, and
    versioned Owner exports without exposing raw tables, provider objects, or
    runtime code.
servers:
  - url: /
    description: Same-origin ShipWithAli deployment
security:
  - OwnerSession: []
tags:
  - name: Configuration
    description: Owner intent for public profile, Contact channels, and Global project CTA.
  - name: Publication
    description: Immutable Revisions and explicit per-language Public lifecycle commands.
  - name: Projects
    description: Project maturity, editorial emphasis, durable routes, and curated relationships.
  - name: Taxonomy
    description: Controlled vocabulary creation, assignment, rename, retirement, and merge.
  - name: Media
    description: Private upload intent, processing evidence, acceptance, rejection, and history.
  - name: CV Portfolio
    description: English CV registration, acceptance, explicit Current CV activation, and history.
  - name: Interaction and Moderation
    description: Feedback approval, rejection, later suppression, and preserved decision history.
  - name: Measurement
    description: Immutable Analytics goal versions, explicit activation, and retained history.
  - name: Portability
    description: Versioned Owner export requests, integrity inspection, and provider-neutral download.
